<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Jayce</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/jayce-cafe-bar-carballo-web/assets/img/logo/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#4E1616">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/jayce-cafe-bar-carballo-web/css/style.css">
<style>
  /* GitHub Pages sirve este archivo para cualquier ruta que no exista, así
     que enlaces y assets usan la ruta absoluta /jayce-cafe-bar-carballo-web/...
     en vez de relativa (una ruta relativa se resolvería contra la URL rota
     que escribió el visitante, no contra la raíz del sitio). */
  body { display: flex; min-height: 100vh; background: var(--papel); }
  .notfound { margin: auto; max-width: 32rem; padding: 3rem 1.5rem; text-align: center; }
  .notfound-mark { width: 56px; height: 56px; margin: 0 auto 1.75rem; }
  .notfound-code { font-family: "Karla", sans-serif; font-size: 0.9rem; font-weight: 700; color: var(--granate-suave); letter-spacing: 0.1em; }
  .notfound h1 { margin-top: 0.75rem; font-family: "Lora", serif; font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 700; line-height: 1.15; }
  .notfound p { margin-top: 1.1rem; color: var(--tinta-suave); font-size: 1.05rem; line-height: 1.6; }
  .notfound-actions { margin-top: 2.25rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <main class="notfound">
    <img class="notfound-mark" src="/jayce-cafe-bar-carballo-web/assets/img/logo/icon.svg" alt="" width="56" height="56">
    <p class="notfound-code">Error 404</p>
    <h1>Esta mesa no está aquí.</h1>
    <p>La página que buscas no existe o se ha movido. Vuelve a la barra — seguro que ahí encuentras algo mejor.</p>
    <div class="notfound-actions">
      <a class="btn btn-primary" href="/jayce-cafe-bar-carballo-web/"><span>Volver al inicio</span></a>
      <a class="btn btn-ghost" href="/jayce-cafe-bar-carballo-web/#encuentranos"><span>Encuéntranos</span></a>
    </div>
  </main>
</body>
</html>
